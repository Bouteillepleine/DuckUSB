name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Drop machine-local JDK path
        # gradle.properties pins org.gradle.java.home to a local Windows JBR;
        # strip it on CI so Gradle uses the runner's JAVA_HOME (JDK 21).
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Install NDK
        # The native prop-spoof lib (libduckusb.so) is built via ndk-build, so the
        # exact NDK pinned by android.ndkVersion must be present on the runner.
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        # The keystore is NOT in the repo. CI reconstructs it from a base64 secret and
        # feeds the signing config via env vars (see app/build.gradle.kts). A fork without
        # these secrets still builds — the release APK just comes out unsigned.
        env:
          KEYSTORE_B64: ${{ secrets.DUCKUSB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/duckusb-release.jks"
            echo "DUCKUSB_STORE_FILE=$RUNNER_TEMP/duckusb-release.jks" >> "$GITHUB_ENV"
            echo "signing keystore decoded"
          else
            echo "::warning::No DUCKUSB_KEYSTORE_BASE64 secret; release APK will be unsigned."
          fi

      - name: Build release APK
        env:
          DUCKUSB_STORE_PASSWORD: ${{ secrets.DUCKUSB_STORE_PASSWORD }}
          DUCKUSB_KEY_ALIAS: ${{ secrets.DUCKUSB_KEY_ALIAS }}
          DUCKUSB_KEY_PASSWORD: ${{ secrets.DUCKUSB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK (ABIs, entrypoints, hooked prop routes, self-skip guard)
        # Codifies the release checklist. Uses here-strings (grep <<<) rather than
        # `cmd | grep -q`: grep -q exits on the first match and closes the pipe, which under
        # `pipefail` reports the producer's SIGPIPE as a failure even when the match succeeded.
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          LIST=$(unzip -l "$APK")
          echo "Checking ABIs in $APK"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -q "lib/$abi/libduckusb.so" <<< "$LIST" \
              && echo "  ok: $abi" \
              || { echo "  MISSING: lib/$abi/libduckusb.so"; exit 1; }
          done
          TOOLS=$(dirname "$(ls "$ANDROID_HOME"/ndk/"${NDK_VERSION}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)")
          unzip -o -q "$APK" 'lib/arm64-v8a/libduckusb.so' -d _apkcheck
          SO=_apkcheck/lib/arm64-v8a/libduckusb.so
          SYMS=$("$TOOLS/llvm-readelf" --dyn-syms "$SO")

          echo "Checking exported entrypoints"
          for sym in native_init Java_com_strawing_duckusb_NativeProps_setProps; do
            grep -q "$sym" <<< "$SYMS" && echo "  ok: $sym exported" \
              || { echo "  MISSING export: $sym"; exit 1; }
          done

          # Every public bionic route to a property value must still be referenced, or the
          # spoof has silently gone partial. __system_property_get is the name route;
          # _read_callback and _read are the two handle routes; _find resolves the handles
          # that setProps caches. Dropping any one of these is how you get a property that
          # reads spoofed one way and truthful another — which is a louder signal than not
          # spoofing at all. (_read_callback resolves against LIBC_O, hence the loose match.)
          echo "Checking bionic property routes are all covered"
          for sym in __system_property_get __system_property_read_callback \
                     __system_property_read __system_property_find; do
            grep -qE "UND +${sym}@" <<< "$SYMS" && echo "  ok: $sym imported" \
              || { echo "  MISSING import: $sym — a property read route is uncovered"; exit 1; }
          done

          # The self-skip guard that fixes issue #2: native_init must refuse to install libc
          # hooks in DuckUSB's own process. If this literal disappears, the guard went with it
          # and the UI is back to inline-hooking libc in a process that has no need of it.
          echo "Checking self-skip guard"
          grep -q 'com.strawing.duckusb' <<< "$("$TOOLS/llvm-strings" "$SO")" \
            && echo "  ok: own-package guard string present" \
            || { echo "  MISSING: own-package guard (see should_skip_hooks)"; exit 1; }

          echo "APK verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuckUSB-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
