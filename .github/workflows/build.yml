name: Build

on:
  push:
    branches: [ master, 'merge-*', 'libxposed-*' ]
    tags: [ 'xposed-v*', 'zygisk-v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.31.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch native dependencies
        # Not `submodules: recursive` on the checkout: LSPlant declares two test-only
        # submodules over git@github.com:, which a blanket recursive fetch tries (and fails)
        # to clone over SSH. Only the ones the build actually compiles are pulled, including
        # dex_builder, which a plain `--recursive` silently skips.
        run: |
          set -euo pipefail
          git submodule update --init \
            zygisk/external/LSPlant zygisk/external/Dobby zygisk/external/xz-embedded
          git -C zygisk/external/LSPlant submodule update --init \
            lsplant/src/main/jni/external/dex_builder
          git -C zygisk/external/LSPlant/lsplant/src/main/jni/external/dex_builder \
            submodule update --init external/parallel_hashmap
          test -f zygisk/external/LSPlant/lsplant/src/main/jni/external/dex_builder/CMakeLists.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Drop machine-local JDK path
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Install NDK and CMake
        # LSPlant needs CMake >= 3.28 (C++23 modules); Dobby's arm64 assembly needs NDK 29.
        run: |
          set -euo pipefail
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        # Never in the repo. A fork without the secrets still builds, just unsigned.
        env:
          KEYSTORE_B64: ${{ secrets.DUCKUSB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/duckusb-release.jks"
            echo "DUCKUSB_STORE_FILE=$RUNNER_TEMP/duckusb-release.jks" >> "$GITHUB_ENV"
            echo "signing keystore decoded"
          else
            echo "::warning::No DUCKUSB_KEYSTORE_BASE64 secret; release artifacts will be unsigned."
          fi

      - name: Build
        env:
          DUCKUSB_STORE_PASSWORD: ${{ secrets.DUCKUSB_STORE_PASSWORD }}
          DUCKUSB_KEY_ALIAS: ${{ secrets.DUCKUSB_KEY_ALIAS }}
          DUCKUSB_KEY_PASSWORD: ${{ secrets.DUCKUSB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :zygisk:app:assembleRelease \
            :zygisk:zygote:assembleRelease --no-daemon --stacktrace

      - name: Verify the Xposed APK
        # These files ARE the module as far as the framework is concerned: lose one and the
        # APK still builds, still installs, and simply never loads. AGP can drop a META-INF
        # path without warning, so the packaged bytes are checked, not the source tree.
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          LIST=$(unzip -l "$APK")
          mkdir -p _check

          for f in module.prop java_init.list scope.list; do
            grep -q "META-INF/xposed/$f" <<< "$LIST" && echo "  ok: $f" \
              || { echo "  MISSING: META-INF/xposed/$f"; exit 1; }
          done

          # The native half is gone; if this comes back, per-app injection came back with it
          # and the module is detectable again.
          grep -q "META-INF/xposed/native_init.list" <<< "$LIST" \
            && { echo "  STALE: native_init.list is packaged but there is no native library"; exit 1; } \
            || echo "  ok: no native_init.list"
          grep -q "libduckusb.so" <<< "$LIST" \
            && { echo "  STALE: libduckusb.so is packaged"; exit 1; } \
            || echo "  ok: no bundled native library"
          grep -q "assets/xposed_init" <<< "$LIST" \
            && { echo "  STALE: legacy assets/xposed_init is packaged"; exit 1; } \
            || echo "  ok: no legacy entry point"

          unzip -p "$APK" META-INF/xposed/module.prop | tr -d '\r' > _check/module.prop
          grep -qE '^minApiVersion=101$' _check/module.prop && echo "  ok: minApiVersion=101" \
            || { echo "  module.prop does not declare minApiVersion=101"; cat _check/module.prop; exit 1; }

          # java_init.list must name a class the APK ships. The dex stores type descriptors
          # (Lcom/foo/Bar;), never the dotted name.
          ENTRY=$(unzip -p "$APK" META-INF/xposed/java_init.list | head -1 | tr -d '\r')
          DESC="L$(echo "$ENTRY" | tr '.' '/');"
          unzip -o -q "$APK" 'classes*.dex' -d _check
          grep -aqF "$DESC" _check/classes*.dex && echo "  ok: entry class $ENTRY present in dex" \
            || { echo "  MISSING: $ENTRY is not in any classes.dex"; exit 1; }

          echo "Xposed APK verified."

      - name: Verify the Zygisk module zip
        run: |
          set -euo pipefail
          ZIP=$(ls zygisk/zygote/build/outputs/magisk/release/*.zip)
          LIST=$(unzip -l "$ZIP")
          for f in module.prop classes.dex customize.sh service.sh post-fs-data.sh \
                   action.sh describe.sh zygisk/arm64-v8a.so zygisk/armeabi-v7a.so; do
            grep -q " $f\$" <<< "$LIST" && echo "  ok: $f" \
              || { echo "  MISSING: $f"; echo "$LIST"; exit 1; }
          done
          # action.sh is what puts the ACTION button on the root manager's module card.
          unzip -p "$ZIP" module.prop | grep -qE '^id=duckusb_zygisk$' \
            && echo "  ok: module id" || { echo "  bad module id"; exit 1; }
          echo "Zygisk zip verified: $ZIP"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk ./DuckUSB-xposed.apk
          cp zygisk/app/build/outputs/apk/release/app-release.apk ./DuckUSB-zygisk-manager.apk
          cp zygisk/zygote/build/outputs/magisk/release/*.zip ./
          ls -l ./*.apk ./*.zip

      - name: Build update.json
        # Only tags publish, so only tags need it. minApiVersion is read out of the built APK
        # rather than hardcoded, so the JSON cannot drift from what shipped.
        if: startsWith(github.ref, 'refs/tags/xposed-v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#xposed-v}"
          APK=DuckUSB-xposed.apk
          NAME="DuckUSB-${VERSION}.apk"
          MIN_API=$(unzip -p "$APK" META-INF/xposed/module.prop | sed -n 's/^minApiVersion=//p' | tr -d '\r')
          [ -n "$MIN_API" ] || { echo "module.prop declares no minApiVersion"; exit 1; }
          VERSION_CODE=$(grep -oE 'versionCode *= *[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          [ -n "$VERSION_CODE" ] || { echo "cannot read versionCode"; exit 1; }
          cat > update.json <<JSON
          {
            "schemaVersion": 1,
            "versionName": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "minApiVersion": ${MIN_API},
            "builtAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": { "sha": "${GITHUB_SHA}" },
            "apk": {
              "name": "${NAME}",
              "downloadUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}",
              "sizeBytes": $(stat -c%s "$APK"),
              "sha256": "$(sha256sum "$APK" | cut -d' ' -f1)"
            }
          }
          JSON
          python3 -c "import json;json.load(open('update.json'))" && cat update.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DuckUSB-release
          path: |
            DuckUSB-xposed.apk
            DuckUSB-zygisk-manager.apk
            DuckUSB-Zygisk-*.zip
            update.json
          if-no-files-found: error

  release-xposed:
    # Publishes the Xposed module only, from an xposed-v* tag. The two variants ship on their
    # own cadence: a fix to one must not force a version bump on the other, and the in-app
    # updater filters releases by this tag prefix.
    if: startsWith(github.ref, 'refs/tags/xposed-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: DuckUSB-release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#xposed-v}"
          mv DuckUSB-xposed.apk "DuckUSB-${VERSION}.apk"
          gh release create "$TAG" "DuckUSB-${VERSION}.apk" update.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Xposed ${VERSION}" \
            --generate-notes

  release-zygisk:
    # Publishes the Zygisk module zip and its manager, from a zygisk-v* tag.
    if: startsWith(github.ref, 'refs/tags/zygisk-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: DuckUSB-release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#zygisk-v}"
          gh release create "$TAG" \
            DuckUSB-Zygisk-*.zip DuckUSB-zygisk-manager.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zygisk ${VERSION}" \
            --generate-notes
