name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Drop machine-local JDK path
        # gradle.properties pins org.gradle.java.home to a local Windows JBR;
        # strip it on CI so Gradle uses the runner's JAVA_HOME (JDK 21).
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Install NDK
        # The native prop-spoof lib (libduckusb.so) is built via ndk-build, so the
        # exact NDK pinned by android.ndkVersion must be present on the runner.
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        # The keystore is NOT in the repo. CI reconstructs it from a base64 secret and
        # feeds the signing config via env vars (see app/build.gradle.kts). A fork without
        # these secrets still builds — the release APK just comes out unsigned.
        env:
          KEYSTORE_B64: ${{ secrets.DUCKUSB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/duckusb-release.jks"
            echo "DUCKUSB_STORE_FILE=$RUNNER_TEMP/duckusb-release.jks" >> "$GITHUB_ENV"
            echo "signing keystore decoded"
          else
            echo "::warning::No DUCKUSB_KEYSTORE_BASE64 secret; release APK will be unsigned."
          fi

      - name: Build release APK
        env:
          DUCKUSB_STORE_PASSWORD: ${{ secrets.DUCKUSB_STORE_PASSWORD }}
          DUCKUSB_KEY_ALIAS: ${{ secrets.DUCKUSB_KEY_ALIAS }}
          DUCKUSB_KEY_PASSWORD: ${{ secrets.DUCKUSB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK (native lib present on all ABIs + symbols exported)
        # Codifies the release checklist: every ABI ships libduckusb.so, and the lib
        # exports the LSPosed entrypoint (native_init) and the JNI bridge (setProps).
        # Uses here-strings (grep <<<) rather than `cmd | grep -q`: grep -q exits on the
        # first match and closes the pipe, which under `pipefail` reports the producer's
        # SIGPIPE as a failure even when the match succeeded.
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          LIST=$(unzip -l "$APK")
          echo "Checking ABIs in $APK"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -q "lib/$abi/libduckusb.so" <<< "$LIST" \
              && echo "  ok: $abi" \
              || { echo "  MISSING: lib/$abi/libduckusb.so"; exit 1; }
          done
          READELF=$(ls "$ANDROID_HOME"/ndk/"${NDK_VERSION}"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          unzip -o -q "$APK" 'lib/arm64-v8a/libduckusb.so' -d _apkcheck
          SYMS=$("$READELF" --dyn-syms _apkcheck/lib/arm64-v8a/libduckusb.so)
          grep -q 'native_init' <<< "$SYMS" || { echo "native_init not exported"; exit 1; }
          grep -q 'Java_com_strawing_duckusb_NativeProps_setProps' <<< "$SYMS" \
            || { echo "setProps JNI not exported"; exit 1; }
          echo "APK verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuckUSB-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
